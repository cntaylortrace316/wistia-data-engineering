name: Wistia Pipeline

on:
  push:
    branches:
      - main

  # schedule:
  #   - cron: '0 12 * * *'

  workflow_dispatch:

jobs:
  run-pipeline:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Wistia Pipeline
        env:
          WISTIA_API_TOKEN: ${{ secrets.WISTIA_API_TOKEN }}
        run: |
          python ingestion/extract_media.py

      - name: Commit updated data files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/

          git diff --staged --quiet || git commit -m "Update Wistia data"

          git push
