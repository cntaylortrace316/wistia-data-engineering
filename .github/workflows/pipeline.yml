name: Wistia Pipeline

on:
  push:
    branches:
      - main

jobs:

  run-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Wistia Pipeline
        env:
          WISTIA_API_TOKEN: ${{ secrets.WISTIA_API_TOKEN }}
        run: |
          python extract_media.py
